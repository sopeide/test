<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>青墨 Codex 桌宠</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main class="stage">
      <section class="hero-card">
        <div class="copy">
          <div class="eyebrow">✨ Hatch Pet · Qingmo</div>
          <h1>青墨，一只会写代码的羊系桌宠</h1>
          <p>基于你给出的“羊大学 TOP 🎓”微信图像与简历项目雏形，设计成温柔、聪明、带一点学术 buff 的 Codex 陪伴宠物。</p>
          <div class="actions" id="actions"></div>
        </div>
        <div class="pet-zone">
          <div class="pet-wrap" id="pet">
            <div class="halo"></div>
            <div class="ear left"></div>
            <div class="ear right"></div>
            <div class="pet-body">
              <div class="cap">🎓</div>
              <div class="eye left"></div>
              <div class="eye right"></div>
              <div class="face" id="face">•ᴗ•</div>
              <div class="blush left"></div>
              <div class="blush right"></div>
              <div class="laptop">⌘ Codex</div>
            </div>
            <div class="paw left"></div>
            <div class="paw right"></div>
          </div>
          <div class="speech">🪄 <span id="line"></span></div>
        </div>
      </section>
      <section class="details">
        <div class="panel identity">
          <h2>桌宠设定</h2>
          <p><strong>名字：</strong>青墨 Qingmo</p>
          <p><strong>物种：</strong>云朵羊 × AI 代码精灵</p>
          <p><strong>性格：</strong>克制、上进、会在关键节点轻轻提醒你。</p>
        </div>
        <div class="panel orbit" aria-label="能力标签">
          <span style="--r:0deg">Top 羊校 buff</span>
          <span style="--r:72deg">简历雷达</span>
          <span style="--r:144deg">Codex 搭档</span>
          <span style="--r:216deg">微信小尾巴</span>
          <span style="--r:288deg">灵感孵化器</span>
          <div class="core">🌙<small>温柔执行</small></div>
        </div>
        <div class="panel contact">
          <h2>💬 社交名片</h2>
          <img src="/wx.jpg" alt="微信二维码" />
          <p>保留已提供的微信图作为互动入口，适合放在“加好友/联系我”浮层。</p>
        </div>
      </section>
    </main>
    <script src="/src/main.js"></script>
  </body>
</html>
